name: release

# Push to main → downloadable release.
#
# Every push to main cuts the next patch version: we bump the manifests, tag
# it, and build the Faro desktop app (macOS universal, Windows, Linux) plus the
# standalone `faro-cli` for all three platforms, attaching every artifact to a
# public GitHub Release anyone can download. You can also trigger it by hand
# from the Actions tab and pin an explicit version.
#
# Builds are UNSIGNED (no Apple Developer / Windows EV cert). The release notes
# spell out the one-time macOS `xattr` step and the Windows SmartScreen click-
# through. To push to main WITHOUT cutting a release, put [skip ci] in the
# commit message — GitHub skips the whole workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.4.0). Blank = auto-bump the patch.'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---- 1. Decide the version, bump manifests, tag, open a draft release ----
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_VERSION" ]; then
            version="$REQUESTED_VERSION"
          else
            last="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' \
                    | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
            if [ -z "$last" ]; then
              # No release tags yet — ship whatever the manifest already says.
              version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            else
              v="${last#v}"; IFS=. read -r MA MI PA <<< "$v"
              version="${MA}.${MI}.$((PA + 1))"
            fi
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Invalid release version'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"    >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Bump manifests
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          node -e "const f='src-tauri/tauri.conf.json';const j=require('./'+f);j.version='${version}';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          # Only the first version line of each manifest (the [package] one).
          sed -i '0,/^version = ".*"/s//version = "'"$version"'"/' src-tauri/Cargo.toml
          sed -i '0,/^version = ".*"/s//version = "'"$version"'"/' src-tauri/faro-cli/Cargo.toml
          sed -i '0,/^version = ".*"/s//version = "'"$version"'"/' src-tauri/faro-agent-proto/Cargo.toml
          sed -i '0,/^version = ".*"/s//version = "'"$version"'"/' src-tauri/faro-agentd/Cargo.toml
          sed -i -E "s/version-[0-9]+\.[0-9]+\.[0-9]+-/version-${version}-/" README.md || true

      - name: Commit, tag, push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin — reusing it."
          else
            git add -A
            git commit -m "release: $tag [skip ci]" || echo "nothing to commit"
            git tag -a "$tag" -m "Faro $tag"
            git push origin HEAD:main
            git push origin "$tag"
          fi

      - name: Open draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          node scripts/release-tools.mjs gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            node scripts/release-tools.mjs gh release create "$tag" --repo "${{ github.repository }}" \
              --draft --title "Faro $tag" \
              --notes "⏳ Build in progress — downloads appear here in ~10 minutes."
          # gh release view also finds drafts, which the REST tag endpoint omits.
          id=$(node scripts/release-tools.mjs gh release view "$tag" --repo "${{ github.repository }}" --json databaseId --jq .databaseId)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Attach the headless one-line installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          # A version-pinned copy so `.../download/<tag>/install-agentd.sh` and
          # `.../releases/latest/download/install-agentd.sh` both resolve.
          node scripts/release-tools.mjs gh release upload "$tag" scripts/install-agentd.sh \
            --repo "${{ github.repository }}" --clobber

  # ---- 2. Desktop app (macOS universal, Windows, Linux) -------------------
  gui:
    needs: prepare
    name: gui (${{ matrix.platform.runner }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-latest
            args: '--target universal-apple-darwin'
          - runner: ubuntu-22.04
            args: ''
          - runner: windows-latest
            args: ''
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: macOS — add universal targets
        if: matrix.platform.runner == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux — install Tauri system deps
        if: matrix.platform.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install npm deps
        run: npm ci

      # Signed auto-updater artifacts (Plan 16) are produced ONLY when the
      # updater signing key is configured as a secret. Without it, the release
      # still builds exactly as before (just no in-app update path) — so adding
      # the updater can never break the pipeline. See docs/updater-key-custody.md.
      - name: Detect updater signing key
        id: updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set — building WITHOUT auto-updater artifacts. Add the secret to enable in-app updates (docs/updater-key-custody.md)."
          fi

      - name: Build + bundle GUI, attach to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Present only when the maintainer has added the secret; tauri-action
          # signs the updater artifacts + generates latest.json when it's set.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          retryAttempts: 3
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'Faro ${{ needs.prepare.outputs.tag }}'
          releaseDraft: true
          prerelease: false
          # Enable createUpdaterArtifacts via a config overlay only when signing.
          args: ${{ matrix.platform.args }}${{ steps.updater.outputs.sign == 'true' && ' --config updater-release.conf.json' || '' }}
          projectPath: src-tauri

      # Portable build: Tauri has no "portable" bundle target, so we just zip
      # the unpacked .exe the build above already produced. Caveats (documented
      # in the release notes): needs WebView2 on the machine, settings still
      # live in %APPDATA%, and faro:// deep links aren't registered.
      - name: Windows — package portable zip
        if: matrix.platform.runner == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          version="${{ needs.prepare.outputs.version }}"
          exe=""
          for candidate in \
            src-tauri/target/release/Faro.exe \
            src-tauri/target/release/faro.exe; do
            if [ -f "$candidate" ]; then exe="$candidate"; break; fi
          done
          if [ -z "$exe" ]; then
            echo "::error::Could not find the built Faro exe under src-tauri/target/release"
            exit 1
          fi
          mkdir -p dist-portable/Faro-portable
          cp "$exe" dist-portable/Faro-portable/Faro.exe
          (cd dist-portable && 7z a "Faro_${version}_x64-portable.zip" Faro-portable >/dev/null)
          node scripts/release-tools.mjs gh release upload "$tag" "dist-portable/Faro_${version}_x64-portable.zip" \
            --repo "${{ github.repository }}" --clobber

  # ---- 3. Standalone CLI binary (all platforms) ---------------------------
  cli:
    needs: prepare
    name: cli (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: faro-cli-macos-arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            asset: faro-cli-macos-x86_64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: faro-cli-linux-x86_64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: faro-cli-windows-x86_64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      # faro-cli links faro_lib, which pulls in tauri — so the Linux build needs
      # the same webkit/gtk system libs the GUI does, even though the CLI itself
      # never opens a window.
      - name: Linux — install system deps
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      # faro_lib's `run()` calls `tauri::generate_context!`, which validates
      # frontendDist (../dist) at COMPILE time — even though the CLI never
      # serves a UI. Building faro-cli compiles faro_lib, so stub the dir to
      # satisfy the macro without running a full Vite build here.
      - name: Stub frontend dist
        shell: bash
        run: |
          mkdir -p dist
          echo '<!doctype html><meta charset="utf-8"><title>faro-cli</title>' > dist/index.html

      - name: Build faro-cli
        working-directory: src-tauri
        # -p selects the workspace member; without it `--bin` only searches the
        # root `faro` package (which no longer owns the CLI binary).
        run: cargo build --release -p faro-cli --bin faro-cli --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.runner }}" = "windows-latest" ]; then
            cp "src-tauri/target/${{ matrix.target }}/release/faro-cli.exe" "dist/${{ matrix.asset }}"
          else
            cp "src-tauri/target/${{ matrix.target }}/release/faro-cli" "dist/${{ matrix.asset }}"
          fi

      - name: Save binary for publication
        uses: actions/upload-artifact@v4
        with:
          name: release-binary-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # ---- 3b. Faro Agent daemon binary (all platforms) -----------------------
  daemon:
    needs: prepare
    name: daemon (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: faro-agentd-macos-arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            asset: faro-agentd-macos-x86_64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: faro-agentd-linux-x86_64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: faro-agentd-windows-x86_64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      # faro-agentd depends ONLY on faro-agent-proto (no faro_lib / tauri), so
      # unlike the cli job it needs no webkit/gtk system libs and no dist stub.
      - name: Build faro-agentd
        working-directory: src-tauri
        run: cargo build --release -p faro-agentd --bin faro-agentd --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.runner }}" = "windows-latest" ]; then
            cp "src-tauri/target/${{ matrix.target }}/release/faro-agentd.exe" "dist/${{ matrix.asset }}"
          else
            cp "src-tauri/target/${{ matrix.target }}/release/faro-agentd" "dist/${{ matrix.asset }}"
          fi

      - name: Save binary for publication
        uses: actions/upload-artifact@v4
        with:
          name: release-binary-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # ---- 4. Write the final notes and publish the release -------------------
  publish:
    needs: [prepare, gui, cli, daemon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download built CLI and daemon binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-binary-*
          path: binaries
          merge-multiple: true

      # A failed upload now requires rerunning only this job, not compiling again.
      - name: Upload binaries to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for asset in binaries/*; do
            test -s "$asset"
            node scripts/release-tools.mjs gh release upload "${{ needs.prepare.outputs.tag }}" "$asset" \
              --repo "${{ github.repository }}" --clobber
          done

      - name: Verify all platform downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-tools.mjs gh release view "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}" --json tagName,assets > release-assets.json
          node scripts/release-tools.mjs verify-assets release-assets.json "${{ needs.prepare.outputs.version }}"

      - name: Generate SHA256 checksums for all assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          mkdir -p assets
          node scripts/release-tools.mjs gh release download "$tag" --repo "${{ github.repository }}" \
            --dir assets --clobber
          # A publication retry must not include the previous checksum file in itself.
          rm -f assets/SHA256SUMS.txt
          (cd assets && sha256sum -- * > ../SHA256SUMS.txt)
          node scripts/release-tools.mjs gh release upload "$tag" SHA256SUMS.txt \
            --repo "${{ github.repository }}" --clobber

      - name: Compose download notes & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          version="${{ needs.prepare.outputs.version }}"
          base="https://github.com/${REPO}/releases/download/${tag}"

          mac=""; win=""; lin=""; cli=""; daemon=""
          while IFS=$'\t' read -r name size; do
            [ -z "$name" ] && continue
            # human-readable size
            if   [ "$size" -ge 1073741824 ]; then hs="$(awk "BEGIN{printf \"%.1f GB\", $size/1073741824}")"
            elif [ "$size" -ge 1048576 ];    then hs="$(awk "BEGIN{printf \"%.1f MB\", $size/1048576}")"
            elif [ "$size" -ge 1024 ];       then hs="$(awk "BEGIN{printf \"%.0f KB\", $size/1024}")"
            else hs="${size} B"; fi
            row="| [\`${name}\`](${base}/${name}) | ${hs} |"$'\n'
            case "$name" in
              *.dmg|*.app.tar.gz)      mac="${mac}${row}" ;;
              *-setup.exe|*.msi|*-portable.zip) win="${win}${row}" ;;
              *.AppImage|*.deb|*.rpm)  lin="${lin}${row}" ;;
              faro-agentd-*)           daemon="${daemon}${row}" ;;
              faro-cli-*)              cli="${cli}${row}" ;;
            esac
          done < <(jq -r '.assets[] | "\(.name)\t\(.size)"' release-assets.json)

          {
            echo "## Faro ${tag}"
            echo
            echo "Cross-platform desktop client for SFTP · FTP · S3 · plus the **Agent Bridge** (hand a live SSH session to an AI agent). Grab the installer for your OS below."
            echo
            echo "### 🖥️ Desktop app"
            echo
            echo "**macOS** (universal — Intel + Apple Silicon)"
            echo
            echo "| File | Size |"
            echo "|------|------|"
            printf '%s' "$mac"
            echo
            echo "> ⚠️ **macOS Gatekeeper:** these builds are **not notarized by Apple**, so the first launch is blocked (\"Faro is damaged / from an unidentified developer\"). Drag **Faro.app** into **/Applications**, then run this once in Terminal:"
            echo '> ```bash'
            echo '> xattr -cr /Applications/Faro.app'
            echo '> ```'
            echo "> Then open it normally. (You only need to do this once per install.)"
            echo
            echo "**Windows** (x64)"
            echo
            echo "| File | Size |"
            echo "|------|------|"
            printf '%s' "$win"
            echo
            echo "> ⚠️ **Windows SmartScreen:** unsigned installer, so you'll see *\"Windows protected your PC.\"* Click **More info → Run anyway**. The \`-setup.exe\` is the NSIS installer; the \`.msi\` is for managed/MDM deployments."
            echo ">"
            echo "> 👜 **Portable:** the \`-portable.zip\` needs no install — unzip and run \`Faro.exe\`. Requires WebView2 (preinstalled on Windows 11 and most Windows 10). Note: settings still live in \`%APPDATA%\`, and \`faro://\` deep links are only registered by the installer."
            echo
            echo "**Linux** (x64)"
            echo
            echo "| File | Size |"
            echo "|------|------|"
            printf '%s' "$lin"
            echo
            echo "> \`.AppImage\`: \`chmod +x\` and run. \`.deb\`: \`sudo apt install ./<file>.deb\`. \`.rpm\`: \`sudo dnf install ./<file>.rpm\`."
            echo
            echo "### ⌨️ Standalone CLI — \`faro-cli\`"
            echo
            echo "Scripts every backend the GUI speaks, using the same saved profiles. Rename to \`faro-cli\` (\`faro-cli.exe\` on Windows), \`chmod +x\` on macOS/Linux, drop it on your \`PATH\`."
            echo
            echo "| File | Size |"
            echo "|------|------|"
            printf '%s' "$cli"
            echo
            echo "> macOS CLI binary is unsigned too — \`xattr -c ./faro-cli-macos-arm64\` before the first run."
            echo
            echo "### 🖥️ Faro Agent — control another machine"
            echo
            echo "**Already have Faro on both machines? You don't need anything below.** Open **Settings → Remote control** on the machine you want to control, toggle it on, click **Show pairing code**, and enter that code on your other Faro. No download, no terminal."
            echo
            echo "For a **headless Linux/macOS server**, one line installs the agent, sets it up as a service, and opens a pairing window:"
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/${REPO}/releases/latest/download/install-agentd.sh | sh"
            echo '```'
            echo
            echo "Or grab the \`faro-agentd\` binary directly and run \`faro-agentd pair\` (then \`faro-agentd install\` to autostart it as a service):"
            echo
            echo "| File | Size |"
            echo "|------|------|"
            printf '%s' "$daemon"
            echo
            echo "> Same unsigned-binary caveats as the CLI (macOS \`xattr -c\`, Windows SmartScreen). The link is end-to-end encrypted and key-pinned; the daemon keeps its own exec/write policy — see the [Faro Agent docs](https://github.com/${REPO}/blob/main/docs/remote-agent.md)."
            echo
            echo "---"
            echo "**Verify your download:** \`SHA256SUMS.txt\` has a checksum for every file above — \`sha256sum -c SHA256SUMS.txt\` (Linux/macOS) or \`certutil -hashfile <file> SHA256\` (Windows)."
            echo
            echo "See the [README](https://github.com/${REPO}/blob/main/README.md) for the full feature tour and the Agent Bridge setup."
          } > notes.md

          node scripts/release-tools.mjs gh release edit "$tag" --repo "$REPO" \
            --notes-file notes.md --draft=false --latest
