name: ci

# Fast feedback for every push + PR: cargo check across the workspace (GUI
# lib + bin and the faro-cli crate) and the Vite typecheck + production bundle.
# No bundling, no platform matrix — that's what release.yml is for.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= .github/workflows/ci.yml .github/workflows/release.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Linux — install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm deps
        run: npm ci

      - name: Release upload retry and completeness tests
        run: node --test scripts/release-tools.test.mjs

      - name: TypeScript + Vite build
        run: npm run build

      - name: cargo check (whole workspace — GUI lib/bin + faro-cli)
        working-directory: src-tauri
        run: cargo check --workspace

      - name: Rust library and CLI tests
        working-directory: src-tauri
        run: |
          cargo test --locked -p faro --lib
          cargo test --locked -p faro-cli

      - name: Setup Python for S3 regression audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: S3 CLI regression audit (local emulator)
        run: |
          python -m pip install 'moto[server]==5.1.12'
          cargo build --locked --manifest-path src-tauri/Cargo.toml -p faro-cli
          python scripts/audit-s3-cli.py

      - name: Upload S3 audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-cli-audit
          path: src-tauri/target/s3-cli-audit.json
          if-no-files-found: ignore

      - name: cargo clippy (warnings allowed for now)
        working-directory: src-tauri
        run: cargo clippy --workspace -- -D warnings -A clippy::all
        continue-on-error: true
