# Server view lab (Plans 30 and 31): a Linux host with systemd as PID 1 and
# its own Docker daemon, so the Services and Docker tabs have real units and
# containers to list, restart and remove.
#
#   dock  / lab-pass   in the docker group, no sudo
#   admin / lab-pass   sudo without a password (not in the docker group)
#   ops   / lab-pass   sudo asks for the password (not in the docker group)
#   guest / lab-pass   no sudo, no docker
#
#   lab-web.service      a running service to restart
#   lab-broken.service   always fails, so "failed" units have a row
#
# The Docker daemon runs INSIDE this container, isolated from the machine's
# own Docker, so tests can stop and remove whatever they like. After the host
# is up, create the throwaway containers (pulls busybox once):
#
#   docker compose -f scripts/server-lab.yml up -d --build
#   docker compose -f scripts/server-lab.yml exec -T host lab-docker-up
#
#   FARO_LIVE_SFTP=127.0.0.1:2225:admin:lab-pass FARO_LIVE_UNIT=lab-web.service \
#     cargo test -p faro --lib sysmon::live_tests -- --ignored --nocapture --test-threads 1
#   FARO_LIVE_SFTP=127.0.0.1:2225:dock:lab-pass \
#     cargo test -p faro --lib docker::live_tests -- --ignored --nocapture --test-threads 1
#
# Plan 30's firewall check wants ufw on; enable it once (it is off by default
# so it cannot get in the way of the inner Docker's networking):
#   docker compose -f scripts/server-lab.yml exec -T host sh -c \
#     'ufw allow 22/tcp && ufw deny 5432/tcp && ufw --force enable'
#
# systemd needs a privileged container with the host cgroup namespace.
services:
  host:
    build:
      context: .
      dockerfile_inline: |
        FROM ubuntu:24.04
        ENV DEBIAN_FRONTEND=noninteractive
        RUN apt-get update && apt-get install -y --no-install-recommends \
              systemd systemd-sysv dbus openssh-server sudo iproute2 procps ufw nftables \
              docker.io ca-certificates \
            && rm -rf /var/lib/apt/lists/*
        RUN for u in dock admin ops guest; do useradd -m -s /bin/bash "$$u" && echo "$$u:lab-pass" | chpasswd; done \
            && usermod -aG docker dock \
            && echo 'admin ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/admin \
            && echo 'ops ALL=(ALL) ALL' > /etc/sudoers.d/ops \
            && chmod 440 /etc/sudoers.d/admin /etc/sudoers.d/ops \
            && printf 'PasswordAuthentication yes\nKbdInteractiveAuthentication no\n' > /etc/ssh/sshd_config.d/lab.conf
        RUN printf '[Unit]\nDescription=Lab web service\n[Service]\nExecStart=/bin/sleep infinity\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/lab-web.service \
            && printf '[Unit]\nDescription=Lab service that always fails\n[Service]\nExecStart=/bin/false\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/lab-broken.service \
            && systemctl enable ssh docker lab-web lab-broken \
            && systemctl mask systemd-resolved getty.target console-getty.service
        COPY <<'EOF' /usr/local/bin/lab-docker-up
        #!/bin/sh
        # (Re)create the lab's throwaway containers, volume and network.
        set -e
        docker rm -f lab-logger lab-idle lab-stopped shop-web-1 shop-db-1 >/dev/null 2>&1 || true
        docker volume rm lab-data lab-orphan >/dev/null 2>&1 || true
        docker network rm lab-net >/dev/null 2>&1 || true
        docker volume create lab-data >/dev/null
        docker volume create lab-orphan >/dev/null
        docker network create lab-net >/dev/null
        mkdir -p /srv/lab-site && echo hello > /srv/lab-site/index.html
        docker run -d --name lab-logger busybox sh -c \
          'i=0; while :; do i=$$((i+1)); echo "tick $$i"; echo "warn $$i" >&2; sleep 1; done' >/dev/null
        docker run -d --name lab-idle --network lab-net -p 127.0.0.1:8088:80 \
          -e LAB_TOKEN=s3cret-value -e MODE=idle \
          -v lab-data:/data -v /srv/lab-site:/site:ro --restart unless-stopped \
          busybox sleep infinity >/dev/null
        docker run --name lab-stopped busybox sh -c 'echo done; exit 3' >/dev/null 2>&1 || true
        docker run -d --name shop-web-1 --label com.docker.compose.project=shop \
          --label com.docker.compose.service=web busybox sleep infinity >/dev/null
        docker run -d --name shop-db-1 --label com.docker.compose.project=shop \
          --label com.docker.compose.service=db busybox sleep infinity >/dev/null
        docker ps -a --format '{{.Names}}\t{{.Status}}'
        EOF
        RUN chmod 755 /usr/local/bin/lab-docker-up
        STOPSIGNAL SIGRTMIN+3
        CMD ["/sbin/init"]
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Both stores must sit on a real filesystem: overlay on overlay fails.
      - lab-docker:/var/lib/docker
      - lab-containerd:/var/lib/containerd
    ports:
      - "127.0.0.1:2225:22"

volumes:
  lab-docker:
  lab-containerd:
