# Standalone Faro CLI. Lives in its own workspace member (rather than as a
# second `[[bin]]` in the `faro` package) so the Tauri bundler never tries to
# pull it into the macOS .app — see the note in ../Cargo.toml.
#
# It depends on the GUI crate's library (`faro_lib`) by path, reusing the exact
# same RemoteFs / Session / sync layers the app runs against. The `faro_lib`
# import name is preserved via `package = "faro"` so the source needs no edits.
[package]
name = "faro-cli"
version = "1.3.38"
edition = "2021"
description = "Faro CLI — SFTP / FTP / S3 / R2 / B2 / Azure Blob from the terminal."
authors = ["Juan Denis"]
license = "MIT"

[[bin]]
name = "faro-cli"
path = "src/main.rs"

[dependencies]
faro_lib = { path = "..", package = "faro" }

# Async runtime + traits shared with the library layers.
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Backends the CLI talks to directly (object_store for S3/R2/B2/Azure puts/gets,
# russh only for the `russh::Error` in the host-key verifier signature).
object_store = { version = "0.11", features = ["aws", "azure"] }
russh = "0.45"
bytes = "1"

# CLI surface + progress bars.
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"

# HTTP client for the `agent` subcommands (localhost http, no TLS) AND for
# `self-update`, which fetches release assets from GitHub over HTTPS — hence the
# `tls` feature (rustls). `json` re-enables send_json/into_json (serde_json);
# `gzip` lets the GitHub API response decompress.
ureq = { version = "2", default-features = false, features = ["json", "tls", "gzip"] }

# Misc
anyhow = "1"
serde_json = "1"
dirs = "5"
base64 = "0.22"

# `fetch` performs an authenticated GET through a saved HTTP(S) profile's
# HttpSession (which is built on reqwest); default features match faro_lib so the
# TLS backend unifies rather than pulling a second stack.
reqwest = { version = "0.12", default-features = false }
