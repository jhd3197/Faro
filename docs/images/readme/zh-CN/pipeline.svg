<svg xmlns="http://www.w3.org/2000/svg" width="600" height="290" viewBox="0 0 600 290" role="img" aria-labelledby="title">
<title id="title">每个分段最多 32 个并发 SFTP 读取请求。这是实现上限，并非速度测试结果。</title>
<rect width="600" height="290" rx="16" fill="#10141c"/>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="43" font-size="16" fill="#e9bd69" font-weight="600" letter-spacing="2">SFTP 流水线下载</text>
<text x="30" y="132" font-size="88" fill="#e9bd69" font-weight="600" >32</text>
<text x="160" y="99" font-size="26" fill="#f4f1ea" font-weight="600" >个并发读取请求</text>
<text x="160" y="135" font-size="21" fill="#b2bac7" font-weight="400" >每个分段的上限</text>
<rect x="32" y="169" width="11" height="29" rx="2" fill="#e9bd69"/><rect x="49" y="169" width="11" height="29" rx="2" fill="#e9bd69"/><rect x="66" y="169" width="11" height="29" rx="2" fill="#e9bd69"/><rect x="83" y="169" width="11" height="29" rx="2" fill="#e9bd69"/><rect x="100" y="169" width="11" height="29" rx="2" fill="#e9bd69"/><rect x="117" y="169" width="11" height="29" rx="2" fill="#e9bd69"/><rect x="134" y="169" width="11" height="29" rx="2" fill="#e9bd69"/><rect x="151" y="169" width="11" height="29" rx="2" fill="#e9bd69"/><rect x="168" y="169" width="11" height="29" rx="2" fill="#e9bd69"/><rect x="185" y="169" width="11" height="29" rx="2" fill="#e9bd69"/><rect x="202" y="169" width="11" height="29" rx="2" fill="#e9bd69"/><rect x="219" y="169" width="11" height="29" rx="2" fill="#e9bd69"/><rect x="236" y="169" width="11" height="29" rx="2" fill="#e9bd69"/><rect x="253" y="169" width="11" height="29" rx="2" fill="#e9bd69"/><rect x="270" y="169" width="11" height="29" rx="2" fill="#e9bd69"/><rect x="287" y="169" width="11" height="29" rx="2" fill="#e9bd69"/><rect x="304" y="169" width="11" height="29" rx="2" fill="#695638"/><rect x="321" y="169" width="11" height="29" rx="2" fill="#695638"/><rect x="338" y="169" width="11" height="29" rx="2" fill="#695638"/><rect x="355" y="169" width="11" height="29" rx="2" fill="#695638"/><rect x="372" y="169" width="11" height="29" rx="2" fill="#695638"/><rect x="389" y="169" width="11" height="29" rx="2" fill="#695638"/><rect x="406" y="169" width="11" height="29" rx="2" fill="#695638"/><rect x="423" y="169" width="11" height="29" rx="2" fill="#695638"/><rect x="440" y="169" width="11" height="29" rx="2" fill="#695638"/><rect x="457" y="169" width="11" height="29" rx="2" fill="#695638"/><rect x="474" y="169" width="11" height="29" rx="2" fill="#695638"/><rect x="491" y="169" width="11" height="29" rx="2" fill="#695638"/><rect x="508" y="169" width="11" height="29" rx="2" fill="#695638"/><rect x="525" y="169" width="11" height="29" rx="2" fill="#695638"/><rect x="542" y="169" width="11" height="29" rx="2" fill="#695638"/><rect x="559" y="169" width="11" height="29" rx="2" fill="#695638"/>
<text x="32" y="238" font-size="20" fill="#b2bac7" font-weight="400" >服务器未提供限制信息时，从 16 个开始。</text>
<text x="32" y="267" font-size="18" fill="#b2bac7" font-weight="400" >这是并发上限，并非实测传输速度。</text>
</g>
</svg>
