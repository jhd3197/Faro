<svg xmlns="http://www.w3.org/2000/svg" width="600" height="290" viewBox="0 0 600 290" role="img" aria-labelledby="title">
<title id="title">Hasta 32 lecturas SFTP simultáneas por rango. Es un límite de implementación, no una prueba de velocidad.</title>
<rect width="600" height="290" rx="16" fill="#10141c"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
