<text x="30" y="132" font-size="88" fill="#e9bd69" font-weight="600" >32</text>
<text x="160" y="99" font-size="26" fill="#f4f1ea" font-weight="600" >lecturas simultáneas</text>
<text x="160" y="135" font-size="21" fill="#b2bac7" font-weight="400" >por rango, como máximo</text>
